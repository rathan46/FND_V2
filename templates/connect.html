{% extends "base.html" %}
{% block title %}Connect | TruthLens AI{% endblock %}
{% block content %}
<section class="contact-grid">
  <div class="glass-panel contact-copy" data-aos="fade-right">
    <p class="eyebrow">Connect us</p>
    <h1>Feedback that improves the lens</h1>
    <p>Send product feedback, report suspicious sources, or share workflow ideas. Messages are stored securely for admin review.</p>
  </div>
  <form method="post" class="glass-panel stacked-form contact-form" data-aos="fade-left">
    <label>Name<input required name="name" value="{{ current_user.name }}"></label>
    <label>Email<input required type="email" name="email" value="{{ current_user.email }}"></label>
    <label>Subject<input required name="subject" placeholder="What should we look at?"></label>
    <label>Feedback<textarea required name="message" rows="7" placeholder="Write your message"></textarea></label>
    <button class="btn btn-neon">Send Feedback</button>
  </form>
</section>
{% endblock %}
