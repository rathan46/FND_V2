{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card glass-panel">
    <p class="eyebrow">Secure recovery</p>
    <h1>Forgot Password</h1>
    <form method="post" class="stacked-form">
      <label>Email<input required type="email" name="email" placeholder="account@email.com"></label>
      <button class="btn btn-neon w-100">Generate Reset Token</button>
    </form>
    {% if reset_token %}
      <div class="token-box">
        Demo reset token: <b>{{ reset_token }}</b><br>
        Reset link: <a href="{{ reset_url }}">{{ reset_url }}</a>
      </div>
    {% endif %}
  </div>
</section>
{% endblock %}
