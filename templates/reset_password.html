{% extends "base.html" %}
{% block title %}Reset Password | TruthLens AI{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card glass-panel">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset Password</h1>
    <p class="hint">Set a new password for {{ user.email }}.</p>
    <form method="post" class="stacked-form">
      <label>New password<input required type="password" name="password" minlength="8" placeholder="Minimum 8 characters"></label>
      <label>Confirm password<input required type="password" name="confirm_password" minlength="8" placeholder="Repeat new password"></label>
      <button class="btn btn-neon w-100">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}
